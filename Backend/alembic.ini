# NiyamNetra — Alembic configuration.
# The schema is created by `alembic upgrade head`, never Base.metadata.create_all():
# create_all silently drops the CHECK constraints and the append-only audit triggers
# that live in the migration scripts. See Docs/06_DATABASE.md and Backend.md §10.
#
# Usage (run from inside backend/):
#   alembic upgrade head
#   alembic revision -m "message"       # then hand-edit; autogenerate misses triggers
[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Put backend/ on sys.path so env.py can `from database import Base` and
# `import models` without a path hack.
prepend_sys_path = .

# Timestamped, timezone-naive UTC revision filenames.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The database URL is NOT set here. env.py reads it from config.settings.DATABASE_URL
# so the .env is the single source of truth and no secret lands in this file.
# sqlalchemy.url =

[post_write_hooks]
# No autoformatter hook configured.

# --- logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
