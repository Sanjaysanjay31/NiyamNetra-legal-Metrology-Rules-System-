# render.yaml — Render Blueprint for the NiyamNetra backend.
#
# Keep this file at the REPO ROOT (next to Backend/, Frontend_App/, ...).
# Render → New → Blueprint → pick the repo, and it reads this.
#
# Prefer clicking through the dashboard instead? Create a Web Service with:
#   Root Directory : Backend
#   Build Command  : pip install -r requirements-render.txt
#   Start Command  : uvicorn main:app --host 0.0.0.0 --port $PORT
#   Health Check   : /health
# The $PORT binding is not optional — Render kills any service that listens on a
# fixed port instead of the one it injects.

services:
  - type: web
    name: niyamnetra-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # prod also flips the refresh cookie to SameSite=None; Secure, which is
      # what lets a locally-run portal/app keep a session against this backend.
      - key: ENV
        value: prod

      - key: APP_NAME
        value: NiyamNetra

      # Set AFTER the first deploy, to this service's own https URL. Used for
      # QR/verification links in generated reports.
      - key: PUBLIC_BASE_URL
        sync: false

      # Strict CORS regex for production (e.g. ^https://.*\.vercel\.app$).
      - key: CORS_ORIGIN_REGEX_PROD
        value: "^https://.*\\.vercel\\.app$"

      # Supabase connection URI. Paste in the dashboard — never commit it.
      #
      # THE ONE THING THAT BREAKS A FIRST DEPLOY: the local .env uses the DIRECT
      # host (db.<ref>.supabase.co:5432), which resolves to IPv6 only. Render
      # dials out over IPv4, so that URI fails here with a connect/DNS error
      # while working fine from the laptop. Use the POOLER host instead:
      #   postgresql+psycopg://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # Port 5432 on the pooler host = session mode: IPv4, and it tolerates
      # psycopg3's prepared statements, which pgbouncer transaction mode (6543)
      # does not. Note the username gains the ".<project-ref>" suffix.
      - key: DATABASE_URL
        sync: false

      # Fresh 64-char secret generated by Render. Note: rotating it invalidates
      # every issued token, so everyone signs in again.
      - key: JWT_SECRET
        generateValue: true

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Must match the bucket that already exists in the project — the local
      # .env uses NiyamNetra_Images. A wrong name here does not raise: the
      # Storage mirror in image_processor.store_upload is best-effort and
      # swallows the failure, so evidence would quietly exist nowhere but this
      # container's disk.
      - key: SUPABASE_BUCKET
        value: NiyamNetra_Images

      # Cloud OCR (512MB-safe). This slim deploy has NO PaddleOCR/Tesseract,
      # so without a key every scan is not_assessed. BEST = Google Vision
      # (console.cloud.google.com → Vision API → API key); FREE = OCR.space
      # (ocr.space/ocrapi/freekey). Set at least one in the dashboard
      # (sync: false = never committed). Cascade: Google → OCR.space.
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      # Cloud-only mode: never attempt the 1.5GB Paddle import on 512MB.
      - key: OCR_PROVIDER
        value: auto
      - key: DISABLE_PADDLE
        value: "1"
